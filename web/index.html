<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ColorPdfSpliter</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
  <script src="./ui.js" defer></script>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text x=%2250%%22 y=%2250%%22 style=%22dominant-baseline:central;text-anchor:middle;font-size:90px;%22>📁</text></svg>" />
</head>

<body class="bg-dark">
  <!-- home在md尺寸下，当output打开时有dim -->
  <div id="home" class="bg-paper-500 text-dark flex justify-center min-h-screen overflow-y-auto
    rounded-none">
    <!-- Content layout -->
    <div class="app-layout">
      <section class="control-panel">
        <div id="title" class="mt-8 md:mt-0 flex flex-col items-start">
          <h1 class="text-4xl lg:text-5xl font-serif hover:underline">
            <a href="https://github.com/huuhghhgyg/ColorPdfSpliter" target="_blank">Color Pdf Spliter</a>
          </h1>
          <h2 class="text-xl lg:text-2xl font-serif mt-2 text-gray-600">with Pyodide</h2>
        </div>
        <p class="font-serif mt-2 lg:mt-4">将PDF的彩色页面与黑白页面分离📄</p>

        <div id="uploads" class="mt-8">
          <h3>打开 PDF 文件</h3>
          <label id="drop-zone" class="drop-zone is-disabled" for="file-input">
            <input class="visually-hidden" type="file" id="file-input" accept=".pdf" disabled="disabled" />
            <span class="upload-mark" aria-hidden="true">PDF</span>
            <span class="upload-copy">
              <strong>拖入文件，或点击选择</strong>
              <small id="upload-hint">Pyodide 准备完成后即可开始</small>
            </span>
            <span id="upload-loading" class="upload-loading">
              <span class="upload-loading-card">
                <span class="loading-spinner" aria-hidden="true"></span>
                <span class="loading-copy">
                  <strong id="loading-title">正在准备运行环境</strong>
                  <span class="loading-steps">
                    <span id="loading-step-pyodide" class="loading-step is-active">
                      <span class="step-icon" aria-hidden="true"></span>
                      <span>加载 Pyodide</span>
                    </span>
                    <span id="loading-step-packages" class="loading-step">
                      <span class="step-icon" aria-hidden="true"></span>
                      <span>加载 PyMuPDF / NumPy</span>
                    </span>
                    <span id="loading-step-script" class="loading-step">
                      <span class="step-icon" aria-hidden="true"></span>
                      <span>加载 PDF 处理逻辑</span>
                    </span>
                  </span>
                </span>
              </span>
            </span>
          </label>
        </div>

        <div class="settings-card">
          <button id="settingsToggle" class="settings-toggle" type="button" aria-expanded="false"
            aria-controls="settings-panel">
            <span>参数设置</span>
            <span id="settingsState" class="settings-state" aria-hidden="true">🔼 展开</span>
          </button>
          <div id="settings-panel" class="settings-panel is-closed">
            <div class="settings-field">
              <label for="rgb-diff">RGBDiff</label>
              <input type="number" id="rgb-diff" required placeholder="30">
            </div>
            <label class="duplex-option" for="duplex-checkbox">
              <input type="checkbox" id="duplex-checkbox">
              <span>双面打印</span>
            </label>
          </div>
        </div>

        <p class="font-serif text-sm text-gray-600 mt-3">💡提示：Web版内存占用较高，长期大批量处理建议使用Python版本</p>

      </section>

      <section id="file-stage" class="file-stage classify-panel is-empty" aria-live="polite">
        <div id="sort-stage" class="sort-stage">
          <article id="source-card" class="file-card source-file">
            <p class="file-eyebrow">上传的文件</p>
            <div class="file-figure">
              <div id="source-pages" class="page-stack source-pages"></div>
              <div id="progress" class="file-progress">
                <progress id="progress-bar" value="0" max="100"></progress>
                <span id="progress-text" class="hidden"></span>
              </div>
              <p id="source-file-status" class="file-status">等待处理</p>
            </div>
            <div class="file-caption">
              <strong id="source-file-name">未选择文件</strong>
              <span id="source-file-size"></span>
            </div>
          </article>

          <div class="sort-arrow" aria-hidden="true">→</div>

          <div class="result-column">
            <article id="gray-card" class="file-card result-card is-waiting">
              <p class="file-eyebrow">黑白部分</p>
              <div class="file-figure">
                <div id="gray-pages" class="page-stack result-pages"></div>
                <p class="file-status"><span id="gray-page-count">0</span> 页</p>
              </div>
              <a id="gray-download-title" class="download-title" aria-disabled="true">黑白页面</a>
            </article>

            <article id="color-card" class="file-card result-card is-waiting">
              <p class="file-eyebrow">彩色部分</p>
              <div class="file-figure">
                <div id="color-pages" class="page-stack result-pages"></div>
                <p class="file-status"><span id="color-page-count">0</span> 页</p>
              </div>
              <a id="color-download-title" class="download-title" aria-disabled="true">彩色页面</a>
            </article>
          </div>
        </div>

      </section>

      <div id="container-download" class="history-panel hidden">
        <h3>已分类文件</h3>
        <div id="download" class="history-list"></div>
      </div>

    </div>
  </div>

  <!-- 输出 -->
  <div id="output" class="fixed z-50 h-4/5 w-full left-0 bottom-0 transition-transform duration-300 ease-out rounded-t-md
    md:h-56 md:w-full md:left-0 md:max-w-none
    flex flex-col flex-auto overflow-hidden">
    <div id="output-title" class="flex p-4 text-sm font-semibold md:py-2 bg-gray-900 text-gray-200 rounded-t-xl md:rounded-t-md">
      <span class="flex-1">📋 输出
      </span>
      <button id="switchOutputBtn" class="ml-4 md:ml-2">🔼🔽 显示</button>
    </div>
    <div id="console" class="flex-auto overflow-auto p-2 lg:p-4 bg-gray-800 text-gray-300">
      ⏳正在准备 Pyodide 和相关依赖...
    </div>
  </div>

</body>

</html>
